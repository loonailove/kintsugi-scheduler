name: Kintsugi Scheduler CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-coordinator:
    name: Build & Test Coordinator
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./coordinator
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kintsugi_db
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/kintsugi_db
          SPRING_DATASOURCE_USERNAME: user
          SPRING_DATASOURCE_PASSWORD: password
        run: ./gradlew build

  build-worker:
    name: Build & Test Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./worker
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Test
        run: ./gradlew build

  verify-docker:
    name: Verify Docker Compose Build
    runs-on: ubuntu-latest
    needs: [build-coordinator, build-worker]  # only runs if both builds pass
    steps:
      - uses: actions/checkout@v4

      - name: Test Docker Compose Build
        run: docker compose build
