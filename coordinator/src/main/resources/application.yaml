server:
  port: 8080

spring:
  application:
    name: coordinator
  datasource:
    url: jdbc:postgresql://postgres:5432/kintsugi_db
    username: ${DB_USER:kintsugi}
    password: ${DB_PASSWORD:kintsugi}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics