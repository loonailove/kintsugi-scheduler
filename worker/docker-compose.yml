services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: kintsugi_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  coordinator:
    build: ./coordinator
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kintsugi_db
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      - postgres

  worker:
    build: ./worker
    environment:
      COORDINATION_URL: http://coordinator:8080
    depends_on:
      - coordinator